[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "koyoapp"
version = "0.2.4"
description = "Koyo is a Python web framework that brings the Next.js app directory experience to pure Python."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Koyo Developers" },
]
dependencies = [
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
    "watchfiles>=0.21.0",
    "typer>=0.12.0",
    "tomlkit>=0.12.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]
dev = [
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.scripts]
koyoapp = "koyoapp.cli:main"

[tool.setuptools.packages.find]
include = ["koyoapp*"]

[tool.setuptools.package-data]
koyoapp = ["assets/*"]